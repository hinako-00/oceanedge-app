<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>OceanEdge</title>

  <link
    rel="stylesheet"
    href="style.css">

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js">
  </script>

</head>

<body>

  <!-- Login -->

  <div
    class="login-screen"
    id="loginScreen">

    <div class="login-box">

      <h1>OceanEdge</h1>

      <input
        type="email"
        id="email"
        placeholder="メール">

      <input
        type="password"
        id="password"
        placeholder="パスワード">

      <button onclick="login()">
        ログイン
      </button>

    </div>

  </div>

  <!-- Header -->

  <header class="header">

    <h2>OceanEdge</h2>

  </header>

  <!-- Main -->

  <main class="main">

    <!-- HOME -->

    <section
      class="page active-page"
      id="homePage">

      <div class="hero-card">

        <h1>
          Dashboard
        </h1>

        <p>
          Today Overview
        </p>

      </div>

      <div class="home-grid">

        <div class="home-card">
          <h3>KPI</h3>
          <span>17件</span>
        </div>

        <div class="home-card">
          <h3>日報</h3>
          <span>5件更新</span>
        </div>

        <div class="home-card">
          <h3>顧客</h3>
          <span>24件</span>
        </div>

        <div class="home-card">
          <h3>タスク</h3>
          <span>8件</span>
        </div>

      </div>

      <div class="card">

        <h2>KPI</h2>

        <canvas id="salesChart">
        </canvas>

      </div>

    </section>

    <!-- Customer -->

    <section
      class="page"
      id="customerPage">

      <div class="card">

        <h2>顧客管理</h2>

        <input
          id="customerUser"
          placeholder="担当者">

        <input
          id="clientName"
          placeholder="クライアント名">

        <input
          id="clientMedia"
          placeholder="媒体名">

        <textarea
          id="clientMemo"
          placeholder="メモ"></textarea>

        <button
          class="primary-btn"
          onclick="saveClient()">

          保存

        </button>

        <div id="clientList">
        </div>

      </div>

    </section>

    <!-- Report -->

    <section
      class="page"
      id="reportPage">

      <div class="card">

        <h2>日報</h2>

        <input
          id="reportUser"
          placeholder="担当者">

        <input
          type="date"
          id="reportDate">

        <textarea
          id="reportInput"
          placeholder="今日の報告"></textarea>

        <button
          class="primary-btn"
          onclick="saveReport()">

          保存

        </button>

        <div id="reportList">
        </div>

      </div>

    </section>

    <!-- Task -->

    <section
      class="page"
      id="taskPage">

      <div class="card">

        <h2>タスク</h2>

        <input
          id="taskUser"
          placeholder="担当者">

        <textarea
          id="taskInput"
          placeholder="タスク"></textarea>

        <button
          class="primary-btn"
          onclick="saveTask()">

          保存

        </button>

        <div id="taskList">
        </div>

      </div>

    </section>

  </main>

  <!-- Bottom Nav -->

  <nav class="bottom-nav">

    <button
      onclick="showPage('homePage')">

      HOME

    </button>

    <button
      onclick="showPage('customerPage')">

      顧客

    </button>

    <button
      onclick="showPage('reportPage')">

      日報

    </button>

    <button
      onclick="showPage('taskPage')">

      タスク

    </button>

  </nav>

  <script
    type="module"
    src="script.js">
  </script>

</body>

</html>
