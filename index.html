<!-- index.html -->

<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OceanEdge</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<nav class="bottom-nav">

  <button>
    ホーム
  </button>

  <button>
    顧客
  </button>

  <button>
    日報
  </button>

  <button>
    タスク
  </button>

  <button
  onclick="
  window.open(
  'https://timetreeapp.com/'
  )">

    予定

  </button>

</nav>

<body>
    <div class="login-screen" id="loginScreen">

  <div class="login-box">

    <h2>
      OceanEdge Login
    </h2>

    <input
      type="email"
      id="email"
      placeholder="メールアドレス">

    <input
      type="password"
      id="password"
      placeholder="パスワード">

    <button onclick="login()">
      ログイン
    </button>

  </div>

</div>

  <!-- Header -->

  <header class="header">

    <div class="header-left">

      <button class="hamburger" onclick="toggleSidebar()">

        <span></span>
        <span></span>
        <span></span>

      </button>

      <h1 class="site-title">
        OceanEdge
      </h1>

    </div>

  </header>

  <!-- Sidebar -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-menu">

      <button>ダッシュボード</button>
      <button>KPI管理</button>
      <button>日報管理</button>
      <button>顧客管理</button>
      <button>見込み管理</button>
      <button>タスク管理</button>
      <button>スケジュール</button>

    </div>

  </aside>

  <!-- Main -->

<main class="main">

  <!-- HOME -->

  <section
  class="page active-page"
  id="homePage">

    <div class="home-grid">

      <div
      class="home-card"
      onclick="showPage('kpiPage')">

        <h3>
          KPI
        </h3>

        <p>
          今週契約 17件
        </p>

      </div>

      <div
      class="home-card"
      onclick="showPage('reportPage')">

        <h3>
          日報
        </h3>

        <p>
          今日の更新 5件
        </p>

      </div>

      <div
      class="home-card"
      onclick="showPage('customerPage')">

        <h3>
          顧客管理
        </h3>

        <p>
          登録顧客 24件
        </p>

      </div>

      <div class="home-card">

        <h3>
          全体共有
        </h3>

        <textarea
        placeholder="共有メモ">
        </textarea>

      </div>

    </div>

  </section>

  <!-- KPI -->

  <section
  class="page"
  id="kpiPage">

    <div class="card">

      <h2>
        KPI管理
      </h2>

      <canvas id="salesChart">
      </canvas>

    </div>

  </section>

  <!-- 顧客管理 -->

  <section
  class="page"
  id="customerPage">

    <div class="card">

      <h2>
        顧客管理
      </h2>

      <input
      id="customerUser"
      placeholder="アポインター">

      <input
      id="clientName"
      placeholder="クライアント名">

      <input
      id="clientMedia"
      placeholder="媒体名">

      <input
      type="file"
      id="clientImage">

      <textarea
      id="clientMemo"
      placeholder="メモ">
      </textarea>

      <button
      class="primary-btn"
      onclick="saveClient()">

        保存

      </button>

      <div id="clientList">
      </div>

    </div>

  </section>

  <!-- 日報 -->

  <section
  class="page"
  id="reportPage">

    <div class="card">

      <h2>
        日報管理
      </h2>

      <input
      id="reportUser"
      placeholder="アポインター">

      <input
      type="date"
      id="reportDate">

      <input
      type="file"
      id="reportImage">

      <textarea
      id="reportInput"
      placeholder="今日の報告">
      </textarea>

      <button
      class="primary-btn"
      onclick="saveReport()">

        保存

      </button>

      <div id="reportList">
      </div>

    </div>

  </section>

</main>
  <!-- Footer -->

  <footer class="footer">

    <div>
      © 2026 OceanEdge
    </div>

    <div>
      Sales Management System
    </div>

  </footer>

  <script type="module" src="script.js"></script>

</body>

<nav class="bottom-nav">

  <button
  onclick="showPage('homePage')">

    ホーム

  </button>

  <button
  onclick="showPage('customerPage')">

    顧客

  </button>

  <button
  onclick="showPage('reportPage')">

    日報

  </button>

  <button
  onclick="showPage('taskPage')">

    タスク

  </button>

  <button
onclick="
window.location.href=
'timetree://'
">

予定

</button>

</nav>

</html>
