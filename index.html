<!-- index.html -->

<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OceanEdge</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<nav class="bottom-nav">

  <button>
    ホーム
  </button>

  <button>
    顧客
  </button>

  <button>
    日報
  </button>

  <button>
    タスク
  </button>

  <button
  onclick="
  window.open(
  'https://timetreeapp.com/'
  )">

    予定

  </button>

</nav>

<body>
    <div class="login-screen" id="loginScreen">

  <div class="login-box">

    <h2>
      OceanEdge Login
    </h2>

    <input
      type="email"
      id="email"
      placeholder="メールアドレス">

    <input
      type="password"
      id="password"
      placeholder="パスワード">

    <button onclick="login()">
      ログイン
    </button>

  </div>

</div>

  <!-- Header -->

  <header class="header">

    <div class="header-left">

      <button class="hamburger" onclick="toggleSidebar()">

        <span></span>
        <span></span>
        <span></span>

      </button>

      <h1 class="site-title">
        OceanEdge
      </h1>

    </div>

  </header>

  <!-- Sidebar -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-menu">

      <button>ダッシュボード</button>
      <button>KPI管理</button>
      <button>日報管理</button>
      <button>顧客管理</button>
      <button>見込み管理</button>
      <button>タスク管理</button>
      <button>スケジュール</button>

    </div>

  </aside>

  <!-- Main -->

  <main class="main">

    <!-- KPI -->

    <section class="card">

      <h2 class="card-title">
        KPIダッシュボード
      </h2>

      <div class="kpi-grid">

        <div class="kpi-card">
          <span>AC数</span>
          <p>124</p>
        </div>

        <div class="kpi-card">
          <span>商談数</span>
          <p>42</p>
        </div>

        <div class="kpi-card">
          <span>契約数</span>
          <p>17</p>
        </div>

        <div class="kpi-card">
          <span>売上</span>
          <p>¥2.4M</p>
        </div>

      </div>

    </section>

    <!-- Graph -->

    <section class="card">

      <h2 class="card-title">
        営業進捗グラフ
      </h2>

      <div class="chart-box">

        <canvas id="salesChart"></canvas>

      </div>

    </section>

    <!-- Customer -->

    <section
class="page"
id="customerPage">

  <div class="card">

    <h2>
      顧客管理
    </h2>

    <input
    id="searchInput"
    placeholder="顧客検索">

    <select id="filterMedia">

      <option value="">
        全媒体
      </option>

      <option>
        Instagram
      </option>

      <option>
        TikTok
      </option>

      <option>
        LINE
      </option>

    </select>

    <input
    id="clientName"
    placeholder="顧客名">

    <input
    id="clientMedia"
    placeholder="媒体">

    <input
    type="file"
    id="clientImage">

    <textarea
    id="clientMemo"
    placeholder="詳細">
    </textarea>

    <button
    class="primary-btn"
    onclick="saveClient()">

      顧客保存

    </button>

    <div id="clientList">
    </div>

  </div>

</section>

    <!-- Report -->

    <section class="card">

      <h2 class="card-title">
        日報履歴
      </h2>

      <div class="report-item">

        <div class="report-top">

          <strong>
            2026/05/07
          </strong>

          <span>
            ヒナ
          </span>

        </div>

        <div class="report-text">

          新規架電45件。
          商談2件。

        </div>

      </div>

    </section>

  </main>

  <!-- Footer -->

  <footer class="footer">

    <div>
      © 2026 OceanEdge
    </div>

    <div>
      Sales Management System
    </div>

  </footer>

  <script type="module" src="script.js"></script>

</body>

<nav class="bottom-nav">

  <button
  onclick="showPage('homePage')">

    ホーム

  </button>

  <button
  onclick="showPage('customerPage')">

    顧客

  </button>

  <button
  onclick="showPage('reportPage')">

    日報

  </button>

  <button
  onclick="showPage('taskPage')">

    タスク

  </button>

  <button
onclick="
window.location.href=
'timetree://'
">

予定

</button>

</nav>

</html>
